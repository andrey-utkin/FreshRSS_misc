name: news.decent.im
services:
  freshrss:
    container_name: freshrss
    image: localhost/decentim-freshrss:2026.04.22
    volumes:
      - /var/www/news.decent.im/var_www_FreshRSS_data:/var/www/FreshRSS/data:z
    ports:
      - 8080:80
    environment:
      - CRON_MIN=11,41
    depends_on:
      - merc
    networks:
      freshrss:
        ipv4_address: 10.100.0.2

  merc:
    container_name: merc
    image: docker.io/wangqiru/mercury-parser-api
    networks:
      freshrss:
        ipv4_address: 10.100.0.3

networks:
  freshrss:
    name: freshrss
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.0.0/24
